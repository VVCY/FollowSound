<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>随响 FollowSound</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }

  /* chrome=1 时出现的一层轻控制条：Android 端和小窗调试用 */
  .chrome {
    position: fixed; left: 0; right: 0; bottom: 0;
    display: none; gap: 10px; align-items: center;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    background: rgba(10, 12, 16, .74);
    backdrop-filter: blur(14px);
    font: 13px/1.3 -apple-system, "SF Pro Text", "PingFang SC", "Noto Sans CJK SC", sans-serif;
    color: #e8ecf3;
  }
  .chrome.on { display: flex; flex-wrap: wrap; }
  .chrome label { opacity: .6; }
  .chrome select, .chrome button {
    font: inherit; color: #e8ecf3; background: rgba(255,255,255,.09);
    border: 1px solid rgba(255,255,255,.14); border-radius: 8px;
    padding: 6px 10px; outline: none;
  }
  .chrome button.on { background: #fff; color: #0b0d12; border-color: #fff; }
  .chrome input[type=range] { width: 120px; accent-color: #fff; }
  .chrome .grow { flex: 1; }
  @media (max-width: 560px) {
    .chrome { gap: 8px; padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); }
    .chrome label { display: none; }
    /* 两个下拉各占半行；滑块 + 数值 + 麦克风按钮占第二行 */
    .chrome select { flex: 0 1 calc(50% - 4px); min-width: 0; }
    .chrome input[type=range] { flex: 1 1 40%; width: auto; min-width: 80px; }
    #heightVal { flex: 0 0 auto; font-variant-numeric: tabular-nums; opacity: .7; }
    .chrome .grow { display: none; }
    .chrome button { flex: 0 0 auto; }
  }
  .hint { position: fixed; inset: 0; display: grid; place-items: center;
    font: 15px/1.6 -apple-system, "PingFang SC", sans-serif; color: #cbd3e1;
    background: rgba(8,10,14,.55); backdrop-filter: blur(2px); }
  .hint.hide { display: none; }
  .hint button {
    font: inherit; color: #0b0d12; background: #fff; border: 0; border-radius: 999px;
    padding: 10px 22px; margin-top: 14px; cursor: pointer;
  }
  .hint .box { text-align: center; max-width: 320px; padding: 24px; }

  /* 麦克风状态条：接不上时明说原因，别让画面继续假装在跟着声音动 */
  #micChip {
    position: fixed; left: 50%; top: calc(40px + env(safe-area-inset-top));
    transform: translateX(-50%);
    display: none; align-items: center; gap: 8px;
    padding: 8px 12px; border-radius: 999px;
    background: rgba(20, 24, 32, .86); color: #e8ecf3;
    font: 12px/1.3 -apple-system, "PingFang SC", "Noto Sans CJK SC", sans-serif;
    white-space: nowrap; box-shadow: 0 4px 16px rgba(0,0,0,.35);
  }
  #micChip.on { display: inline-flex; }
  #micChip b { font-weight: 600; color: #ff8c9f; }
  #micChip button {
    font: inherit; color: #0b0d12; background: #fff; border: 0; border-radius: 999px;
    padding: 4px 10px;
  }
  #micChip button.ghost { background: rgba(255,255,255,.14); color: #e8ecf3; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<pre id="err" style="display:none;position:fixed;left:8px;top:8px;color:#ff5a7a;font:12px/1.4 monospace;background:rgba(0,0,0,.6);padding:8px;border-radius:6px;max-width:90vw;white-space:pre-wrap"></pre>

<div class="chrome" id="chrome">
  <label>特效</label>
  <select id="style"></select>
  <label>配色</label>
  <select id="theme"></select>
  <label>高度</label>
  <input type="range" id="height" min="80" max="400" step="1">
  <span id="heightVal">180</span>
  <span class="grow"></span>
  <button id="micBtn">接麦克风</button>
</div>

<div class="hint" id="hint">
  <div class="box">
    <div>点一下，让声音出现在屏幕上。</div>
    <button id="grant">允许麦克风</button>
  </div>
</div>

<div id="micChip">
  <span>麦克风没接上 · <b id="micErr"></b></span>
  <button id="micRetry">重试</button>
  <button id="micSetting" class="ghost">去设置</button>
</div>

<script>
  // 出错时把错误打到页面上：覆盖层场景里没有控制台可看，静默失败最难查
  window.addEventListener('error', function (e) {
    var el = document.getElementById('err');
    if (el) { el.style.display = 'block'; el.textContent = 'error: ' + (e.message || e.error); }
  });
</script>
<script src="themes.js"></script>
<script src="visualizer.js"></script>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var isDemo = q.get('demo') === '1';
  var stage = document.getElementById('stage');
  // 覆盖层场景必须透明；全屏预览（Android 现场模式 / 本地看图）想要一层底色
  var bg = q.get('bg');
  if (bg) document.body.style.background = '#' + bg.replace('#', '');

  var fs = FollowSound.create(stage, {
    style: q.get('style') || localStorage.getItem('fs.style') || 'band',
    theme: q.get('theme') || localStorage.getItem('fs.theme') || 'ocean',
    height: Number(q.get('height') || localStorage.getItem('fs.height') || 180),
    demo: isDemo
  });
  window.fs = fs;
  fs.start();

  // ---- 控制条 ----
  var chrome = document.getElementById('chrome');
  if (q.get('chrome') === '1') {
    chrome.classList.add('on');
    var selStyle = document.getElementById('style');
    var selTheme = document.getElementById('theme');
    FollowSound.STYLES.forEach(function (s) {
      var o = document.createElement('option'); o.value = s.key; o.textContent = s.title;
      selStyle.appendChild(o);
    });
    (window.FS_THEMES || []).forEach(function (t) {
      var o = document.createElement('option'); o.value = t.key; o.textContent = t.name;
      selTheme.appendChild(o);
    });
    selStyle.value = fs.style;
    selTheme.value = fs.themeKey;
    var range = document.getElementById('height');
    var hv = document.getElementById('heightVal');
    range.value = fs.getHeight(); hv.textContent = fs.getHeight();

    // 宿主桥：Android 端把选择存进 SharedPreferences，悬浮层启动时读同一份
    function remember(k, v) {
      try { if (window.FSHost) window.FSHost.set(k, String(v)); } catch (e) { /* 非 Android 环境 */ }
    }

    selStyle.onchange = function () { fs.setStyle(this.value); localStorage.setItem('fs.style', this.value); remember('style', this.value); };
    selTheme.onchange = function () { fs.setTheme(this.value); localStorage.setItem('fs.theme', this.value); remember('theme', this.value); };
    range.oninput = function () { fs.setHeight(Number(this.value)); hv.textContent = this.value; remember('height', this.value); };
    range.onchange = function () { localStorage.setItem('fs.height', this.value); };

    var micBtn = document.getElementById('micBtn');
    micBtn.classList.toggle('on', fs.isMic());
    micBtn.onclick = function () {
      if (fs.isMic()) { fs.detachMic(); micBtn.classList.remove('on'); }
      else { connect().then(function (ok) { micBtn.classList.toggle('on', !!ok); }); }
    };
  }

  // ---- 麦克风 ----
  var hint = document.getElementById('hint');
  var chip = document.getElementById('micChip');
  var chipErr = document.getElementById('micErr');
  var chipSetting = document.getElementById('micSetting');
  var attaching = null;

  function showChip(name) {
    chipErr.textContent = name || '未知原因';
    chip.classList.add('on');
    console.log('mic fail: ' + name);
  }

  function connect() {
    if (fs.isMic()) return Promise.resolve(true);
    if (attaching) return attaching;   // 连点两下别开两条流
    attaching = fs.attachMic().then(function () {
      attaching = null;
      hint.classList.add('hide');
      chip.classList.remove('on');
      var b = document.getElementById('micBtn');
      if (b) b.classList.add('on');
      // 打到宿主日志里：悬浮层/App 内没有控制台，出问题只能靠这一行
      console.log('mic ok: ' + JSON.stringify(window.fsMicInfo()));
      return true;
    }).catch(function (e) {
      attaching = null;
      hint.classList.add('hide');
      showChip((e && e.name) || (e && e.message) || 'Error');
      return false;
    });
    return attaching;
  }

  document.getElementById('micRetry').onclick = function () { connect(); };
  chipSetting.onclick = function () {
    try { if (window.FSHost && window.FSHost.settings) FSHost.settings(); } catch (e) {}
  };

  // 宿主（Android 拿到系统权限后 / 拒了权限时 / Electron 主进程）调用
  window.fsEnsureMic = function () { return connect(); };
  window.fsRetryMic = window.fsEnsureMic;   // 旧调用点的别名
  // 宿主已经知道失败原因（比如用户在系统弹窗里点了拒绝），不用再试一次，直接亮状态条
  window.fsMicError = function (name) { hint.classList.add('hide'); showChip(name); };
  window.fsMicInfo = function () { return fs.micInfo ? fs.micInfo() : null; };

  if (isDemo) { hint.classList.add('hide'); fs.setDemo(true); }
  else {
    document.getElementById('grant').onclick = function () { connect(); };
    // 桌面端（Electron / 已授权环境）不用点，直接试；Android 只有拿到系统权限才传 1
    if (q.get('autostart') === '1' || location.protocol === 'file:') connect();
  }

  // 供宿主（Electron 主进程 / Android）调用
  window.fsSetStyle = function (k) { fs.setStyle(k); };
  window.fsSetTheme = function (k) { fs.setTheme(k); };
  window.fsSetHeight = function (h) { fs.setHeight(h); };
  window.fsCloseHint = function () { hint.classList.add('hide'); };
})();
</script>
</body>
</html>
